    2025-12-29: Initial version.
    
    When you do not want to rely on servers, services or third parties. This
    straigthforward password manager encrypts all your passwords and stores
    it locally at your browsers local storages. Everything is encrypted in
    that store. When you type in the password, the encrypted passwords will
    be visualized in the browser. No server communication, just on your local

<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Local Browser-Based Password Manager</title>

<link
  href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
  rel="stylesheet"
  integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7eEEBYjDtcYj+AjBH3FLv5uSJuXg=="
  crossorigin="anonymous"
>

<script
  src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"

  crossorigin="anonymous"
></script>

<script
  src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
  integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="

  crossorigin="anonymous"
></script>

<style>
body.dark-mode {
    background: #121212;
    color: #e0e0e0;
}

/* Formulieren en input fields */
.dark-mode .form-control,
.dark-mode textarea {
    background: #1e1e1e;
    color: #e0e0e0;
    border-color: #333;
}

/* Buttons */
.dark-mode .btn {
    color: #e0e0e0;
}

/* List-group items */
.dark-mode .list-group-item {
    background: #1e1e1e;
    color: #e0e0e0;
    border-color: #333;
}

/* Actieve list-group item */
.dark-mode .list-group-item.active {
    background: #333;
    color: #fff;
    font-weight: bold;
}

/* Nav-tabs */
.dark-mode .nav-tabs .nav-link {
    color: #e0e0e0;
    background-color: #1e1e1e;
    border-color: #333 #333 #1e1e1e;
}

.dark-mode .nav-tabs .nav-link.active {
    background-color: #333;
    color: #fff;
    border-color: #333 #333 #333;
}

/* Header / modal titles */
.dark-mode h3, .dark-mode h5, .dark-mode .modal-title {
    color: #e0e0e0;
}

/* Detail pane */
.dark-mode .small.text-muted {
    color: #bbb !important;
}

/* Alert box */
.dark-mode .alert {
    background-color: #333;
    color: #fff;
    border-color: #555;
}

/* Modal content */
.dark-mode .modal-content {
    background-color: #1e1e1e;
    color: #e0e0e0;
    border-color: #333;
}

/* Dark mode navbar */
.dark-mode .navbar {
    background-color: #1e1e1e !important;
    color: #e0e0e0 !important;
}

/* Navbar brand/title */
.dark-mode .navbar .navbar-brand,
.dark-mode .navbar .nav-link {
    color: #e0e0e0 !important;
}

/* Dark mode placeholders */
body.dark-mode ::placeholder {
    color: #ccc; /* light gray, readable on dark background */
    opacity: 1;   /* ensures full visibility */
}

/* Inputs and textareas text color */
body.dark-mode input,
body.dark-mode textarea {
    color: #fff;  /* text inside input is white */
}

.list-group-item.active {
    font-weight: bold;
}

.alert-container {
    position: fixed;
    bottom: 1rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1055; /* boven modals */
    width: 90%;
    max-width: 600px;
    pointer-events: none;
}
.alert-container .alert {
    pointer-events: auto;
    margin-bottom: 0.5rem;
}
</style>
</head>

<body class="p-3">

<div id="alerts" class="alert-container"></div>

<!-- HEADER -->
<nav class="navbar navbar-expand-lg navbar-light bg-light mb-3 rounded shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="#">🔐 Local Browser-Based Password Manager</a>
    <span id="vaultStatus" class="badge bg-secondary">Locked</span>
  </div>
</nav>

<!-- LOGIN -->
<div id="loginScreen">
    <input type="password" id="masterPassword" class="form-control mb-2" placeholder="Master password">
    <button class="btn btn-primary" onclick="openVault()">Open vault</button>
    <button class="btn btn-secondary" onclick="createVault()">Create new vault</button>
    <!-- Vault file upload -->
    <div class="mt-3">
        <label class="form-label">Of upload een bestaande vault:</label>
        <input type="file" id="vaultFileInput" class="form-control mb-2" accept=".json">
        <button class="btn btn-primary" onclick="loadVaultFromFile()">Upload vault</button>
    </div>
</div>

<!-- APP -->
<div id="appScreen" style="display:none">

    <!-- TABS -->
    <ul class="nav nav-tabs mb-2" id="tabs"></ul>

    <div class="row" style="height:70vh">

        <!-- ITEMS -->
        <div class="col-3 border-end overflow-auto">
            <div class="d-flex justify-content-between mb-2">
                <strong>Items</strong>
                <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#addItemModal">+</button>
            </div>
            <div class="list-group" id="items"></div>
        </div>

        <!-- EDITOR -->
        <div class="col-6 border-end overflow-auto">
            <div id="passwordEditor" style="display:none">
                <h5>Password</h5>
                <input class="form-control mb-2" id="title" placeholder="Title">
                <input class="form-control mb-2" id="username" placeholder="Username">
                <div class="input-group mb-2">
                    <input class="form-control" id="password" type="password" placeholder="Password">
                    <button class="btn btn-outline-secondary" type="button"
                            onclick="togglePasswordVisibility()"
                            title="Toon / verberg wachtwoord">
                        👁️
                    </button>

                    <button class="btn btn-outline-secondary" type="button"
                            onclick="copyPassword()"
                            title="Kopieer naar clipboard">
                        📋
                    </button>

                    <button class="btn btn-outline-secondary" type="button"
                            onclick="generatePassword()"
                            title="Genereer wachtwoord">
                        🎲
                    </button>
                </div>
                <input class="form-control mb-2" id="url" placeholder="URL">
                <textarea class="form-control" id="notes" rows="4" placeholder="Notes"></textarea>
            </div>

            <div id="noteEditor" style="display:none">
                <h5>Secure note</h5>
                <input class="form-control mb-2" id="noteTitle" placeholder="Title">
                <textarea class="form-control" id="noteContent" rows="10"></textarea>
            </div>
        </div>

        <!-- META -->
        <div class="col-3">
            <div class="mb-2">
                <strong>Details</strong>
            </div>
            <div class="small text-muted mb-2">
                Type: <span id="itemType">—</span><br>
                Updated: <span id="itemUpdated">—</span>
            </div>
            <button class="btn btn-success w-100 mb-2" onclick="saveItem()">Save item</button>
            <button class="btn btn-danger w-100" onclick="deleteItem()">Delete item</button>

            <hr>
            <button class="btn btn-outline-secondary w-100" onclick="toggleDark()">Toggle dark mode</button>
            <button class="btn btn-outline-danger w-100 mt-2" onclick="lockVault()">Lock vault</button>

            <hr>
            <button class="btn btn-outline-info w-100 mb-2" onclick="downloadVault()">Download vault</button>
            <button class="btn btn-outline-danger w-100" onclick="deleteVaultFile()">Delete vault</button>
        </div>
    </div>
</div>

<!-- Add Item Modal -->
<div class="modal fade" id="addItemModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add new item</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="list-group">
          <button class="list-group-item list-group-item-action" onclick="createItem('password')" data-bs-dismiss="modal">
            🔑 Password
            <div class="small text-muted">Username & password for a website or service</div>
          </button>
          <button class="list-group-item list-group-item-action" onclick="createItem('note')" data-bs-dismiss="modal">
            📝 Secure note
            <div class="small text-muted">Free text, secrets or notes</div>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let vault = null;
let masterPassword = "";
let activeTab = null;
let activeItem = null;
const AUTO_LOCK_MINUTES = 5;
let autoLockTimer = null;

// === CLIPBOARD AUTO WIPE CONFIG ===
const CLIPBOARD_WIPE_SECONDS = 30;
let clipboardWipeTimer = null;

function alertMsg(msg,type="success"){
    $("#alerts").html(`<div class="alert alert-${type}">${msg}</div>`);
    setTimeout(()=>$("#alerts").empty(),3000);
}

function saveVault(){
    saveVaultSJCL();
}

function saveVaultSJCL(pw=masterPassword){
    vault.meta.updated = new Date();
    const enc = sjcl.encrypt(pw, JSON.stringify(vault), {
        ks: 256,
        iter: 250000,
        mode: "ccm",
        ts: 128
    });

    localStorage.setItem("vault", enc);
}

function createVault(){
    if (localStorage.getItem("vault")) {
        const ok = confirm(
            "Er bestaat al een vault.\n\n" +
            "Als u doorgaat, wordt de bestaande vault PERMANENT verwijderd.\n\n" +
            "Weet u zeker dat u wilt doorgaan?"
        );
        if (!ok) {
            return; // gebruiker annuleert → niets doen
        }
    }

    const pw = $("#masterPassword").val();
    if (!pw) {
        return alertMsg("Password required", "danger");
    }

    vault = {
        meta: {
            version: 2,
            created: new Date(),
            updated: new Date()
        },
        tabs: [
            {
                id: crypto.randomUUID(),
                name: "General",
                items: []
            }
        ]
    };

    saveVaultSJCL(pw);
    openVault();
}

function openVault(){
    try{
        masterPassword = $("#masterPassword").val();
        $("#masterPassword").val("");
        const enc = localStorage.getItem("vault");
        if(!enc) return alertMsg("No vault found","danger");
        vault = JSON.parse(sjcl.decrypt(masterPassword, enc));
        $("#loginScreen").hide();
        $("#appScreen").show();
        renderTabs();
        resetAutoLockTimer();
        updateVaultStatus(false);
        alertMsg("Vault opened");
    }catch(e){
        console.error(e);
        alertMsg("Wrong password or corrupted vault","danger");
    }
}

function lockVault(){
    // Stop timers
    if (autoLockTimer) {
        clearTimeout(autoLockTimer);
        autoLockTimer = null;
    }

    // Best-effort memory wipe
    secureWipe(vault);
    vault = null;

    // Wipe master password
    if (masterPassword) {
        masterPassword = null;
    }

    activeTab = null;
    activeItem = null;

    // Wipe UI fields
    $("input, textarea").val("");

    // UI reset
    $("#appScreen").hide();
    $("#loginScreen").show();

    if (clipboardWipeTimer) {
        clearTimeout(clipboardWipeTimer);
        clipboardWipeTimer = null;
    }
    wipeClipboard();

    updateVaultStatus(true);

    alertMsg("Vault locked", "warning");
}

function autoLockVault() {
    if (!vault) return;

    console.warn("Vault auto-locked");

    lockVault();
}

function resetAutoLockTimer(){
    if(!vault) return;
    if(autoLockTimer) clearTimeout(autoLockTimer);
    autoLockTimer = setTimeout(autoLockVault, AUTO_LOCK_MINUTES*60*1000);
}

function toggleDark() {
    const body = $("body");
    body.toggleClass("dark-mode");

    // Save preference in localStorage
    const isDark = body.hasClass("dark-mode");
    localStorage.setItem("darkMode", isDark ? "1" : "0");
}

function generatePassword(){ const chars="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()"; let p=""; for(let i=0;i<24;i++) p+=chars[Math.floor(Math.random()*chars.length)]; $("#password").val(p); }

/* TABS */
function renderTabs(){
    $("#tabs").empty();
    vault.tabs.forEach(t=>{
        $("#tabs").append(`<li class="nav-item">
            <button class="nav-link ${activeTab===t.id?'active':''}" onclick="selectTab('${t.id}')">${t.name}</button>
        </li>`);
    });
    $("#tabs").append(`<li class="nav-item">
        <button class="nav-link" onclick="addTab()">+</button>
    </li>`);
    if(!activeTab) selectTab(vault.tabs[0].id);
}

function addTab(){
    const name = prompt("Tab name");
    if(!name) return;
    vault.tabs.push({id:crypto.randomUUID(),name,items:[]});
    saveVault();
    renderTabs();
}

function selectTab(id){
    activeTab=id;
    activeItem=null;
    renderTabs();
    renderItems();
    $("#noteEditor").hide();
    $("#passwordEditor").hide();
}

/* ITEMS */
function renderItems(){
    $("#items").empty();
    const tab = vault.tabs.find(t=>t.id===activeTab);
    tab.items.forEach(i=>{
        $("#items").append(`<button class="list-group-item ${activeItem===i.id?'active':''}"
            onclick="selectItem('${i.id}')">${i.title}</button>`);
    });
}

function createItem(type){
    const item = {
        id: crypto.randomUUID(),
        type: type,
        title: type === "password" ? "New password" : "New note",
        updated: new Date()
    };

    if(type === "password"){
        item.username = "";
        item.password = "";
        item.url = "";
        item.notes = "";
    } else {
        item.content = "";
    }

    const tab = vault.tabs.find(t => t.id === activeTab);
    tab.items.push(item);

    activeItem = item.id;
    saveVault();
    renderItems();
    selectItem(item.id);
}

function selectItem(id){
    activeItem=id;
    renderItems();
    const item = vault.tabs.find(t=>t.id===activeTab).items.find(i=>i.id===id);
    $("#itemType").text(item.type);
    $("#itemUpdated").text(item.updated);

    if(item.type==="password"){
        $("#noteEditor").hide();
        $("#passwordEditor").show();
        $("#title").val(item.title||"");
        $("#username").val(item.username||"");
        $("#password").val(item.password||"");
        $("#url").val(item.url||"");
        $("#notes").val(item.notes||"");
        passwordInVisibility();
    } else {
        $("#passwordEditor").hide();
        $("#noteEditor").show();
        $("#noteTitle").val(item.title||"");
        $("#noteContent").val(item.content||"");
    }
}

function saveItem(){
    const item = vault.tabs.find(t=>t.id===activeTab).items.find(i=>i.id===activeItem);
    if(!item) return;
    item.updated=new Date();

    if(item.type==="password"){
        Object.assign(item,{
            title:$("#title").val(),
            username:$("#username").val(),
            password:$("#password").val(),
            url:$("#url").val(),
            notes:$("#notes").val()
        });
    }else{
        item.title=$("#noteTitle").val();
        item.content=$("#noteContent").val();
    }
    saveVault();
    renderItems();
    alertMsg("Item saved");
}

function deleteItem(){
    if (!activeItem) return;

    const item = vault.tabs
        .find(t => t.id === activeTab)
        .items
        .find(i => i.id === activeItem);

    const ok = confirm(
        `Weet u zeker dat u het item "${item.title}" wilt verwijderen?\n\n` +
        "Deze actie kan niet ongedaan worden gemaakt."
    );

    if (!ok) return; // gebruiker annuleert

    const tab = vault.tabs.find(t => t.id === activeTab);
    tab.items = tab.items.filter(i => i.id !== activeItem);

    activeItem = null;
    saveVault();
    renderItems();

    alertMsg("Item verwijderd", "warning");
}

function autoLockVault() {
    if (!vault) return;

    console.warn("Vault auto-locked");

    vault = null;
    masterPassword = "";
    activeTab = null;
    activeItem = null;

    $("#appScreen").hide();
    $("#loginScreen").show();
    $("#masterPassword").val("");

    alertMsg("Vault locked due to inactivity", "warning");
}

function resetAutoLockTimer() {
    if (!vault) return;

    if (autoLockTimer) {
        clearTimeout(autoLockTimer);
    }

    autoLockTimer = setTimeout(() => {
        autoLockVault();
    }, AUTO_LOCK_MINUTES * 60 * 1000);
}

/* EXTRA */
function generatePassword(){
    const chars="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()";
    let p="";
    for(let i=0;i<24;i++) p+=chars[Math.floor(Math.random()*chars.length)];
    $("#password").val(p);
}

function passwordInVisibility() {
    const field = document.getElementById("password");
    field.type = "password";
}

function togglePasswordVisibility() {
    const field = document.getElementById("password");
    field.type = field.type === "password" ? "text" : "password";
}

function copyPassword() {
    const field = document.getElementById("password");
    const value = field.value;

    if (!value) {
        alertMsg("Geen wachtwoord om te kopiëren", "warning");
        return;
    }

    navigator.clipboard.writeText(value)
        .then(() => {
            alertMsg(
                `Wachtwoord gekopieerd (wordt na ${CLIPBOARD_WIPE_SECONDS}s gewist)`,
                "success"
            );

            // Reset bestaande timer
            if (clipboardWipeTimer) {
                clearTimeout(clipboardWipeTimer);
            }

            clipboardWipeTimer = setTimeout(() => {
                wipeClipboard();
            }, CLIPBOARD_WIPE_SECONDS * 1000);
        })
        .catch(() => {
            alertMsg("Kopiëren naar clipboard mislukt", "danger");
        });
}

function wipeClipboard() {
    navigator.clipboard.writeText("")
        .then(() => {
            console.warn("Clipboard gewist");
        })
        .catch(() => {
            console.warn("Clipboard wissen mislukt");
        });

    clipboardWipeTimer = null;
}

function secureWipe(obj) {
    if (!obj) return;

    if (typeof obj === "string") {
        return null;
    }

    if (Array.isArray(obj)) {
        for (let i = 0; i < obj.length; i++) {
            obj[i] = null;
        }
        obj.length = 0;
    } else if (typeof obj === "object") {
        for (const key in obj) {
            if (obj.hasOwnProperty(key)) {
                obj[key] = secureWipe(obj[key]);
            }
        }
    }

    return null;
}

function updateVaultStatus(locked=true){
    const badge = $("#vaultStatus");
    if(locked){
        badge.text("Locked");
        badge.removeClass("bg-success").addClass("bg-secondary");
    } else {
        badge.text("Unlocked");
        badge.removeClass("bg-secondary").addClass("bg-success");
    }
}

// Upload een vault-bestand
function loadVaultFromFile() {
    const input = document.getElementById("vaultFileInput");
    if (!input.files || input.files.length === 0) {
        alertMsg("Selecteer eerst een vault-bestand", "warning");
        return;
    }

    // Check of er al een vault bestaat
    if (localStorage.getItem("vault")) {
        const ok = confirm(
            "Er bestaat al een vault.\n\n" +
            "Als u doorgaat, wordt de bestaande vault PERMANENT vervangen.\n\n" +
            "Weet u zeker dat u wilt doorgaan?"
        );
        if (!ok) return; // gebruiker annuleert → niets doen
    }

    const file = input.files[0];
    const reader = new FileReader();

    reader.onload = function(e) {
        try {
            const contents = e.target.result;

            const pw = prompt("Voer het master password in om de vault te ontsleutelen:");
            if (!pw) return alertMsg("Vault laden geannuleerd", "warning");

            const decrypted = JSON.parse(sjcl.decrypt(pw, contents));

            vault = decrypted;
            masterPassword = pw;

            // sla op in localStorage
            localStorage.setItem("vault", sjcl.encrypt(masterPassword, JSON.stringify(vault)));

            $("#loginScreen").hide();
            $("#appScreen").show();
            renderTabs();
            resetAutoLockTimer();
            alertMsg("Vault succesvol geladen", "success");

        } catch (err) {
            console.error(err);
            alertMsg("Kon vault-bestand niet lezen of wachtwoord fout", "danger");
        }
    };

    reader.readAsText(file);
}

// Download vault
function downloadVault() {
    if (!vault || !masterPassword) {
        alertMsg("Geen vault geladen of geen wachtwoord beschikbaar", "warning");
        return;
    }

    const encrypted = sjcl.encrypt(masterPassword, JSON.stringify(vault));
    const filename = "vault.json";

    const pom = document.createElement('a');
    pom.setAttribute('href', 'data:text/json;charset=utf-8,' + encodeURIComponent(encrypted));
    pom.setAttribute('download', filename);
    pom.click();

    alertMsg("Vault versleuteld gedownload", "success");
}

// Verwijder vault
function deleteVaultFile() {
    if (!vault) {
        alertMsg("Geen vault geladen", "warning");
        return;
    }

    const ok = confirm(
        "Weet u zeker dat u de huidige vault wilt verwijderen?\n\n" +
        "Deze actie kan niet ongedaan worden gemaakt."
    );
    if (!ok) return;

    localStorage.removeItem("vault");
    vault = null;
    masterPassword = "";
    activeTab = null;
    activeItem = null;

    $("input, textarea").val("");
    $("#appScreen").hide();
    $("#loginScreen").show();

    alertMsg("Vault verwijderd", "warning");
}

["mousemove", "keydown", "click", "scroll"].forEach(event => {
    document.addEventListener(event, resetAutoLockTimer);
});

window.addEventListener("beforeunload", () => {
    wipeClipboard();
});

$(document).ready(function() {
    const darkMode = localStorage.getItem("darkMode");
    if (darkMode === "1") {
        $("body").addClass("dark-mode");
    } else {
        $("body").removeClass("dark-mode");
    }
});
</script>
</body>
</html>
